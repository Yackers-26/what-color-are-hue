<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HueMemory palette demo</title>
</head>
<body>
  <h1>HueMemory palette demo</h1>
  <p>Click a button to save a sample color, the same way HueSee will.</p>
  <button type="button" data-rgb="220,20,60">Save crimson</button>
  <button type="button" data-rgb="30,90,220">Save blue</button>
  <button type="button" data-rgb="250,220,40">Save yellow</button>
  <p id="found" role="status" aria-live="polite"></p>

  <div id="palette"></div>

  <script type="module">
    import { classifyColor } from "/src/vision/colorDetector.js";
    import { saveColor } from "/js/huememory.js";
    import { mountPalette } from "/js/palettePanel.js";

    mountPalette(document.getElementById("palette"), {
      onFindAgain: (color) => {
        document.getElementById("found").textContent =
          `Find again: ${color.colorName} rgb(${color.rgb.r}, ${color.rgb.g}, ${color.rgb.b})`;
      }
    });

    for (const button of document.querySelectorAll("[data-rgb]")) {
      button.addEventListener("click", () => {
        const [r, g, b] = button.dataset.rgb.split(",").map(Number);
        saveColor(classifyColor(r, g, b));
      });
    }
  </script>
</body>
</html>
